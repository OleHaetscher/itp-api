# Publishes the browser client (ui/) to GitHub Pages, so it can be opened by
# link: https://olehaetscher.github.io/itp-api/. Opened there, the page points
# at the deployed API and asks for an API key. Needs the repository to be
# public (or a paid plan) and Settings > Pages > Source set to "GitHub Actions".
name: Browser client on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - id: deployment
        uses: actions/deploy-pages@v4
